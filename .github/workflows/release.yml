# Builds Trasmuta for every system and, for a version tag (v1.2.3), publishes a GitHub Release with:
#   macOS (Apple Silicon and Intel): a .dmg (first installs: drag the app onto Applications) and a zip (what the
#     in-app update downloads), built here;
#   Windows: Trasmuta-<version>-win-Setup.exe and the portable zip; Linux: tar.gz for x64 (built and tested by
#     windows-linux.yml; ARM64 is left out for now, see the windows-linux job);
#   Trasmuta-<version>-SHA256SUMS.txt with the checksums of all of them.
# The app's update check (UpdateService) reads that release: its text is the version's section of CHANGELOG.md,
# including the hidden "<!-- update" block that sets how insistent the notice is. Nothing is published unless every
# system built and passed its tests.
#
# Publishing a version: set <Version> in Directory.Build.props, add its section to CHANGELOG.md, push to main, then
# either push the tag (git tag v1.2.3 && git push origin v1.2.3), or push a branch release/v1.2.3 pointing at a commit
# of main (where tags can't be pushed), or run the workflow by hand on main with "publish" ticked (Actions → Release →
# Run workflow). The last two make the tag v<Version> themselves, on the commit they built, and stop if it exists.
# Running it by hand without "publish" only builds the macOS files, as downloadable artifacts; so does a push to a
# wip/ branch.

name: Release

on:
  push:
    tags: ['v*.*.*']
    branches: ['wip/**', 'release/v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish v<Version> from Directory.Build.props (main only; makes the tag)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # What this run publishes: the pushed tag; v<Version> for a release/v<Version> branch on a commit of main, or when run
  # by hand on main with "publish"; nothing otherwise.
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: plan
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif { [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$PUBLISH" = true ]; } ||
               [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            tag="v$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
            if [[ "$GITHUB_REF" == refs/heads/release/* ]] && [ "${GITHUB_REF_NAME#release/}" != "$tag" ]; then
              echo "::error::Branch $GITHUB_REF_NAME does not match <Version> in Directory.Build.props ($tag)"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Publish only commits of main ($GITHUB_SHA is not on main)"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag exists already: raise <Version> in Directory.Build.props first"
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  windows-linux:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/windows-linux.yml
    with:
      version: ${{ needs.plan.outputs.tag }}
      # Not released for now: on Ubuntu 22.04 ARM the app sometimes doesn't finish exiting after Quit (the launch
      # check catches it). Pushes to wip/ branches still build and check it.
      linux-arm64: false

  build:
    strategy:
      matrix:
        runtime: [osx-arm64, osx-x64]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props"
            exit 1
          fi

      - name: Fetch the bundled engines (7-Zip, rhwp; pinned and checksum-verified)
        shell: pwsh
        run: build/fetch-portable-engines.ps1 -Runtime ${{ matrix.runtime }} -Destination "$env:RUNNER_TEMP/engines"

      - name: Install dmgbuild (writes the .dmg window's layout without Finder)
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7

      - name: Build and pack
        env:
          TRASMUTA_RUNTIME: ${{ matrix.runtime }}
          TRASMUTA_ENGINES: ${{ runner.temp }}/engines
          TRASMUTA_OUT: ${{ runner.temp }}/out
          TRASMUTA_DMGBUILD: ${{ runner.temp }}/dmgbuild/bin/dmgbuild
        run: build/build-trasmuta-macos.sh --zip --dmg

      - name: Check the packed app
        run: |
          mkdir "$RUNNER_TEMP/check"
          ditto -x -k "$RUNNER_TEMP"/out/Trasmuta-*.zip "$RUNNER_TEMP/check"
          codesign --verify --deep --strict "$RUNNER_TEMP/check/Trasmuta.app"
          test -x "$RUNNER_TEMP/check/Trasmuta.app/Contents/MacOS/engines/7zip/7zz"

      - name: Check the disk image
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$RUNNER_TEMP"/out/Trasmuta-*.dmg
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/Trasmuta.app"
          test "$(readlink "$RUNNER_TEMP/dmg/Applications")" = /Applications
          test -f "$RUNNER_TEMP/dmg/.DS_Store"
          hdiutil detach "$RUNNER_TEMP/dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.runtime }}
          path: |
            ${{ runner.temp }}/out/Trasmuta-*.zip
            ${{ runner.temp }}/out/Trasmuta-*.dmg
          if-no-files-found: error

  release:
    needs: [plan, build, windows-linux]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          version="${TAG#v}"
          # The release files only (the Linux jobs' own checksum files stay behind), all of them in one checksum file.
          mkdir dist
          cp packages/Trasmuta-*.dmg packages/Trasmuta-*.zip packages/Trasmuta-*-win-Setup.exe packages/Trasmuta-*.tar.gz dist/
          (cd dist && sha256sum Trasmuta-* > "Trasmuta-$version-SHA256SUMS.txt")
          # The version's section of CHANGELOG.md: from its "## <version>" heading to the next "## ".
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          # A pushed tag must exist; a run by hand makes it here, on the commit that was built and tested.
          if [ "$GITHUB_REF_TYPE" = tag ]; then where=--verify-tag; else where="--target=$GITHUB_SHA"; fi
          gh release create "$TAG" dist/* --title "Trasmuta $version" --notes-file notes.md "$where"
